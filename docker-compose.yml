# The application uses MongoDB Atlas and Upstash Redis from .env.
# Start the full stack: npm run docker:up
# Dashboard: http://localhost:3000 (or DASHBOARD_PORT).
services:
  datadog:
    image: gcr.io/datadoghq/agent:7
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_APM_ENABLED: 'true'
      DD_APM_NON_LOCAL_TRAFFIC: 'true'
      DD_LOGS_ENABLED: 'true'
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: 'true'
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: 'true'
      DD_PROCESS_AGENT_ENABLED: 'true'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    ports:
      - '8126:8126'
      - '8125:8125/udp'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'agent health']
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: '3001'
      DD_AGENT_HOST: datadog
      DD_TRACE_AGENT_URL: http://datadog:8126
      DD_SERVICE: sensorguard-api
      DD_ENV: ${DD_ENV:-development}
      NODE_ENV: production
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      datadog:
        condition: service_healthy
    labels:
      com.datadoghq.ad.logs: '[{"source":"nodejs","service":"sensorguard-api"}]'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 5

  simulator:
    build:
      context: .
      dockerfile: packages/simulator/Dockerfile
    env_file: .env
    environment:
      API_URL: http://api:3001
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    labels:
      com.datadoghq.ad.logs: '[{"source":"nodejs","service":"sensorguard-simulator"}]'
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
    ports:
      - '${DASHBOARD_PORT:-3000}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
